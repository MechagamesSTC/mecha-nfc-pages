<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="index-style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mecha Games NFC Box Index</title>
</head>
<body>

  <header>
    <img src="mecha-logo.jpg" alt="Mecha Games Logo" class="logo">
    <h1>Welcome to Mecha Games NFC Box Index</h1>
  </header>

  <div class="search-bar" style="text-align:center; margin-bottom: 2rem;">
    <input type="text" id="setSearch" placeholder="Search set name..." onKeyUp="searchSet()" style="padding: 0.6rem; width: 260px; font-size: 1rem; border-radius: 5px; border: 1px solid #fcd34d; background-color: #1e1e1e; color: #fff;">
    <button onclick="searchSet()" style="padding: 0.6rem 1.2rem; font-size: 1rem; margin-left: 0.5rem; border-radius: 5px; border: none; background-color: #e3342f; color: #fff; cursor: pointer;">Search</button>
  </div>

  <ul id="boxListContainer"></ul>

  <script>
    const boxList = ["Box 01", "Box 02", "Box 03", "Box 04", "Box 05", "Box 06", "Box 07", "Box 08", "Box 09", "Box 10", "Box 11", "Box 12", "Box 13", "Box 14", "Box 15", "Box 16", "Box 17", "Box 18", "Box 19", "Box 20", "Box 21", "Box 22",
                     "Box 23", "Box 24", "Box 25", "Box 26", "Box 27", "Box 28", "Box 29", "Box 30"];

    const boxSetMap = {
  "Box 01": ["Commander Anthology Vol 2", "Legends, "Duel Deck", "Starter Commander Decks", "Secret Lair Drop Series", "The List", "Mystery Booster", "Mystery Booster 2", "Secret Lair Showdown", "Wizards Play Network", "Starter", "Resale", "Store Championships", "Love Your LGS", "Duel Decks", "Commander", "2011", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "Ikoria", "2021", "Strixhaven", "Anthology", "Foundations: Jumpstart", "Foundations Jumpstart", "Jumpstart 2022", "Jumpstart", "Modern Masters", "Modern Masters 2015", "Modern Masters 2017", "Special Guests"],
  "Box 02": ["Kaldheim", "Double Masters 2022"],  
  "Box 03": ["Edge of Eternities", "Edge of Eternities Stellar Sights", "Oath of the Gatewatch", "Kaladesh"],
  "Box 04": ["Zendikar Rising", "Streets of New Capenna"],
  "Box 05": ["Commander Legends: Battle for Baldur's Gate", "Double Masters", "Theros"],
  "Box 06": ["Guilds of Ravnica", "Ravnica Allegience", "Ultimate Masters"],
  "Box 07": ["Innistrad: Crimson Vow"],
  "Box 08": ["Final Fantasy", "Innistrad: Midnight Hunt"],
  "Box 09": ["Ikoria: Lair of Behemoths", "Theros Beyond Death", "Throne of Eldraine", "Commander Masters", "Modern Horizons 1"],
  "Box 10": ["Dominaria Remastered", "Lord of the Rings", "March of Machines Aftermath", "March of the Machines", "Multiverse Legends", "Wilds of Eldraine", "Wilds of Eldraine: Enchanting Tales"],
  "Box 11": ["Dominaria United", "Unfinity"],
  "Box 12": ["Kamigawa: Neon Dynasty"],
  "Box 13": ["Adventure's in the forgotten realms", "War of the Spark"],
  "Box 14": ["Doctor Who", "Lost Caverns of Ixalan", "Strixhaven: Mystical Archives"],
  "Box 15": ["Modern Horizons 2"],
  "Box 16": ["Modern Horizons 3", "Secrets of Strixhaven"],
  "Box 17": ["Murders at Karlov Manor", "Ravnica Remastered"],
  "Box 18": ["Brother's War", "Phyrexia: All Will be One"],
  "Box 19": ["Bloomburrow"],
  "Box 20": ["Duskmourn"],
  "Box 21": ["Aetherdrift", "Foundations", "Innistrad Remastered"],
  "Box 22": ["Outlaws of Thunder Junction", "Tarkir: Dragonstorm"],
  "Box 23": ["Dragon's Maze", "Fate Reforged", "Gatecrash", "Mirrodin", "Zendikar", "Rise of the Eldrazi", "Scars of Mirrodin", "Mirrodin Besieged", "New Phyrexia", "Innistrad", "Dark Ascension", "Avacyn Restored", "Journey into Nyx", "Return to Ravnica", "Born of the Gods", "Conflux", "Eventide", "Ravnica City of Guilds", "Fifth Dawn", "Eighth Edition", "Ninth Edition", "Darksteel", "Battlebond", "Future Sight", "Alara Reborn", "Betrayers of Kamigawa", "Champions of Kamigawa", "Coldsnap", "Dissension", "Guildpact", "Lorwyn", "Morningtide", "Planar Chaos", "Planechase 2012", "Saviors of Kamigawa", "Shadowmoor", "Shards of Alara", "Tenth Edition", "Time Spiral", "Worldwake", "Conspiracy"],
  "Box 25": ["Amonkhet", "Dragons of Tarkir", "Khans of Tarkir", "Magic Origins", "Battle for Zendikar", "Masters 25", "Iconic Masters", "Conspiracy Take the Crown", "Eternal Masters", "Aether Revolt", "Dominaria", "Eldritch Moon", "Shadows Over Innistrad", "Explorers of Ixalan", "Rivals of Ixalan", "Game Night 2017", "Hour of Devastation", "Time Spiral Remastered", "Ixalan", "Universes Beyond Assassin's Creed, "Universes Beyond: Fallout", "Universes Beyond Fallout", "Universes Beyond: Warhammer 40000", "Universes Beyond Warhammer 40,000", "Universes Beyond Doctor Who"],
  "Box 26": ["Core Set 2011", "Core Set 2012", "Core Set 2013", "Core Set 2014", "Core Set 2015", "Core Set 2019", "Core Set 2020", "Core Set 2021"],  
  "Box 27": ["Alliances", "Exodus", "Fallen Empires", "Ice Age", "Invasion", "Judgment", "Mercadian Masques", "Mirage", "Odyssey", "Onslaught", "Prophecy", "Scourge", "Seventh Edition", "Sixth Edition", "Torment", "Urza's Destiny", "Urza's Legacy", "Visions", "Weatherlight", "Homelands", "Fourth Edition", "The Dark", "Chronicles", "Legions", "Nemesis", "Planeshift", "Stronghold", "Tempest", "Urza's Saga", "Antiquities", "Revised", "Unlimited Edition", "Fifth Edition", "Unglued"],  
  "Box 28": ["Marvel's Spider-Man"],
  "Box 29": ["Avatar The Last Airbender", "The Lord of the Rings"],
  "Box 30": ["Marvel Super Heroes", "Marvel Universe", "The Hobbit"]
};

    const container = document.getElementById("boxListContainer");
    boxList.forEach(boxNum => {
      const boxId = boxNum.replace("Box ", "");
      const li = document.createElement("li");
      li.className = "set-card";
      const link = document.createElement("a");
      link.href = "box_" + boxId + ".html";
      link.textContent = boxNum;
      li.appendChild(link);
      container.appendChild(li);
    });

    function searchSet() {
  const input = document.getElementById("setSearch").value.toLowerCase();
  const matches = [];

  for (const box in boxSetMap) {
    const matchSets = boxSetMap[box].filter(set =>
      set.toLowerCase().includes(input)
    );
    if (matchSets.length > 0) {
      matches.push({ box, sets: matchSets });
    }
  }

  // If exactly one match, auto-redirect - always showing clickable results is more helpful so i commented this out and edited the statement below - DV
  //if (matches.length === 1) {
  //  const boxNumber = matches[0].box.replace("Box ", "").padStart(2, '0');
  //  window.location.href = `box_${boxNumber}.html`;
  //}
  // If multiple matches, show clickable results
  // edited this statement too, was originally: else if (matches.length > 1) {
  if (matches.length > 0) {
    const container = document.getElementById("boxListContainer");
    container.innerHTML = ""; // clear previous results

    matches.forEach(match => {
      const boxNumber = match.box.replace("Box ", "").padStart(2, '0');
      const li = document.createElement("li");
      li.className = "set-card";
      const link = document.createElement("a");
      link.href = `box_${boxNumber}.html`;
      link.textContent = `${match.box} (${match.sets.join(", ")})`;
      li.appendChild(link);
      container.appendChild(li);
    });
  } else {
    alert("Set not found in any box.");
  }
}

  </script>

</body>
</html>
